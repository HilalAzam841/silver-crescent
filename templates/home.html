{% extends 'base.html' %}

{% load static %}



{% block content %}

<!-- ========================= SECTION MAIN ========================= -->
<section class="section-intro padding-y-sm">
<div class="container">

	<!-- Hero Banner Start -->
<section class="hero-banner">
  <div class="overlay"></div>
  <div class="content">
    <h1 class="title">Silver Crescent</h1>
    <p class="tagline">Elegance in Every Scent</p>
    <a href="{% url 'store' %}" class="btn-banner">Shop Now</a>
  </div>
</section>

<style>
.hero-banner {
  position: relative;
  height: 50vh; /* 👈 Changed from 100vh to 50vh */
  background: url("{% static 'images/banners/womenbanner.jpg' %}") 
              no-repeat center center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
  perspective: 1000px;
}

.hero-banner:hover {
  background-position: center top;
  transform: scale(1.02);
  transition: all 1.5s ease-in-out;
}

.hero-banner .overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.35);
  z-index: 1;
}

.hero-banner .content {
  position: relative;
  z-index: 2;
  color: #fff;
  animation: fadeZoom 2s ease-out forwards;
}

.hero-banner .title {
  font-size: 3rem; /* 👈 smaller for short banner */
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
  transform: rotateY(-30deg);
  animation: text3d 3s ease-in-out infinite alternate;
}

.hero-banner .tagline {
  font-size: 1.2rem;
  margin-top: 8px;
  font-style: italic;
  color: #f0f0f0;
  text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
}

.btn-banner {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 22px;
  font-size: 1rem;
  background: #444;
  color: #fff;
  border-radius: 25px;
  text-decoration: none;
  transition: all 0.4s ease;
}
.btn-banner:hover {
  background: #666;
  transform: scale(1.1);
}

/* Animations */
@keyframes fadeZoom {
  0% {opacity: 0; transform: scale(0.8);}
  100% {opacity: 1; transform: scale(1);}
}

@keyframes text3d {
  from { transform: rotateY(-25deg) translateZ(30px); }
  to { transform: rotateY(25deg) translateZ(30px); }
}
</style>
<!-- Hero Banner End -->


</div> <!-- container //  -->
</section>
<!-- ========================= SECTION MAIN END// ========================= -->

<!-- ========================= SECTION  ========================= -->
<section class="section-name padding-y-sm">
<div class="container">

<header class="section-heading">
	<a href="{% url 'store' %}" class="btn btn-outline-primary float-right">See all</a>
	<h3 class="section-title">Popular products</h3>
</header><!-- sect-heading -->

	
<div class="row">
	{% for product in products %}
	<div class="col-md-3">
		<div class="card card-product-grid">
			<a href="{{ product.get_url }}" class="img-wrap"> <img src="{{ product.images.url }}"> </a>
			<figcaption class="info-wrap">
				<a href="{{ product.get_url }}" class="title">{{ product.product_name }}</a>
				<div class="price mt-1">PKR {{ product.price }}</div> <!-- price-wrap.// -->
			</figcaption>
		</div>
	</div> <!-- col.// -->
	{% endfor %}
</div> <!-- row.// -->
</div><!-- container // -->
</section>
<!-- ========================= SECTION  END// ========================= -->




</body>
</html>


{% endblock %}
